name: Docker sync, test and publish
on:
  push:
    branches: [main]
    paths-ignore: [dsh-tavern-runtime.json]
  schedule:
    # Daily clock + UTC day gate gives a true three-day cadence across months.
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: docker-publish
  cancel-in-progress: false
jobs:
  cadence:
    if: github.repository == 'gungnirayu/dsh-tavern'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          day=$(( $(date -u +%s) / 86400 ))
          anchor=$(( $(date -u -d '2026-10-13' +%s) / 86400 ))
          if [ "$EVENT_NAME" != schedule ] || [ $(( (day - anchor) % 3 )) -eq 0 ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
  docker:
    needs: cadence
    # Never publish to the upstream repository.
    if: github.repository == 'gungnirayu/dsh-tavern' && needs.cadence.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream preserving merge history
        shell: bash
        run: bash .github/scripts/docker-sync.sh
      - name: Test Docker HTTP adapter
        run: node --test docker/proxy.test.mjs docker/settings-adapter.test.mjs docker/browser-compat.test.mjs
      - name: Select exact source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tavern:test
          platforms: linux/amd64
          build-args: SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test empty bind mount, HTTP, persistence and shutdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tavern-data"
          cleanup() { docker logs tavern-test 2>&1 | sed -E 's/(token=)[^[:space:]]+/\1[redacted]/g' || true; docker rm -f tavern-test || true; }
          trap cleanup EXIT
          docker run -d --name tavern-test -p 127.0.0.1:3080:3080 \
            -e DSH_TAVERN_PUBLIC_URL=http://192.168.1.10:3088 \
            -v "$RUNNER_TEMP/tavern-data:/data" tavern:test
          ready() {
            for attempt in $(seq 1 90); do
              state=$(docker inspect -f '{{.State.Health.Status}}' tavern-test)
              if [ "$state" = healthy ]; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' tavern-test)" != true ]; then return 1; fi
              sleep 2
            done
            return 1
          }
          ready
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.168.1.10:3088' http://127.0.0.1:3080/)
          [[ "$code" = 200 || "$code" = 401 ]]
          docker cp docker/api-smoke.mjs tavern-test:/tmp/api-smoke.mjs
          docker exec tavern-test node /tmp/api-smoke.mjs
          docker exec tavern-test sh -c 'echo persisted > /data/profile-data/docker-smoke-marker'
          docker stop -t 30 tavern-test
          [[ $(docker inspect -f '{{.State.ExitCode}}' tavern-test) != 137 ]]
          docker start tavern-test
          ready
          docker exec tavern-test test -f /data/profile-data/docker-smoke-marker
          docker exec tavern-test node /tmp/api-smoke.mjs
          # Force the upgrade path against a populated mount.
          docker stop -t 30 tavern-test
          sudo sh -c 'echo smoke-old > "$1/.docker-image-revision"' sh "$RUNNER_TEMP/tavern-data"
          docker start tavern-test
          ready
          docker exec tavern-test test -f /data/profile-data/docker-smoke-marker
          docker exec tavern-test node /tmp/api-smoke.mjs
          docker exec tavern-test sh -c 'test "$(cat /data/.docker-image-revision)" != smoke-old'
      - name: Test real browser at a non-loopback HTTP origin
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker logs tavern-browser 2>&1 | sed -E 's/(token=)[^[:space:]]+/\1[redacted]/g' || true; docker rm -f tavern-browser || true; }
          trap cleanup EXIT
          npm install --prefix "$RUNNER_TEMP/docker-browser" playwright@1.58.2 --no-audit --no-fund
          "$RUNNER_TEMP/docker-browser/node_modules/.bin/playwright" install --with-deps chromium
          docker run -d --name tavern-browser -p 127.0.0.1:3088:3080 \
            -e DSH_TAVERN_PUBLIC_URL=http://tavern.test:3088 tavern:test
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' tavern-browser)" = healthy ]; then break; fi
            test "$(docker inspect -f '{{.State.Running}}' tavern-browser)" = true
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' tavern-browser)" = healthy
          PLAYWRIGHT_PACKAGE_DIR="$RUNNER_TEMP/docker-browser" node docker/browser-smoke.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        shell: bash
        env:
          REVISION: ${{ steps.source.outputs.sha }}
          SHORT: ${{ steps.source.outputs.short }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag tavern:test "$image:sha-$SHORT"
          docker tag tavern:test "$image:$REVISION"
          docker tag tavern:test "$image:latest"
          docker push "$image:sha-$SHORT"
          docker push "$image:$REVISION"
          docker push "$image:latest"
